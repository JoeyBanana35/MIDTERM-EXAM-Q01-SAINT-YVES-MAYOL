<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Computer Lab Reservations</title>
  <style>
    :root {
      --bg: #eef1f4;
      --panel: #ffffff;
      --ink: #1c2530;
      --muted: #5d6b7a;
      --line: #d3dae1;
      --accent: #0b6e6e;
      --accent-ink: #ffffff;
      --danger: #b3261e;
      --ok: #1b6b3a;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    header {
      background: var(--ink);
      color: #ffffff;
      padding: 20px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
    }

    header p {
      margin: 2px 0 0;
      color: #b8c4d0;
      font-size: 0.92rem;
    }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 18px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
    }

    textarea {
      min-height: 64px;
      resize: vertical;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: #ffffff;
      color: var(--accent);
    }

    button.danger {
      padding: 4px 10px;
      border-color: var(--danger);
      background: #ffffff;
      color: var(--danger);
    }

    .hint {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .stack {
      display: grid;
      gap: 20px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row input {
      flex: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .toolbar h2 {
      margin: 0;
    }

    .msg {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .msg.show {
      display: block;
    }

    .msg.error {
      background: #fbe9e7;
      color: var(--danger);
    }

    .msg.success {
      background: #e4f3ea;
      color: var(--ok);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f6f8fa;
      font-weight: 600;
      white-space: nowrap;
    }

    .num {
      text-align: right;
    }

    .empty {
      padding: 14px 0;
      color: var(--muted);
    }

    .found {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      background: #f6fafa;
    }

    .found dl {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 2px 10px;
      margin: 0;
    }

    .found dt {
      color: var(--muted);
    }

    .found dd {
      margin: 0;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Computer Lab Reservations</h1>
    <p>Book seats in a lab, look up a booking by ID, or cancel one.</p>
  </header>

  <main>
    <div class="stack">
      <section aria-labelledby="add-title">
        <h2 id="add-title">New reservation</h2>
        <form id="add-form">
          <label for="student_name">Student name</label>
          <input id="student_name" name="student_name" required>

          <label for="lab">Lab</label>
          <select id="lab" name="lab" required>
            <option>Lab 1</option>
            <option>Lab 2</option>
            <option>Lab 3</option>
            <option>Lab 4</option>
          </select>

          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>

          <label for="number_of_seats">Number of seats</label>
          <input id="number_of_seats" name="number_of_seats" type="number" min="1" max="30" step="1" required>
          <div class="hint">Between 1 and 30.</div>

          <label for="purpose">Purpose</label>
          <textarea id="purpose" name="purpose" required></textarea>

          <div style="margin-top: 14px;">
            <button type="submit">Add reservation</button>
          </div>
          <div id="add-msg" class="msg" role="status"></div>
        </form>
      </section>

      <section aria-labelledby="find-title">
        <h2 id="find-title">Find by ID</h2>
        <form id="find-form" class="row">
          <input id="find-id" type="number" min="1" placeholder="Reservation ID" aria-label="Reservation ID" required>
          <button type="submit">Search</button>
        </form>
        <div id="find-msg" class="msg" role="status"></div>
        <div id="find-result"></div>
      </section>
    </div>

    <section aria-labelledby="list-title">
      <div class="toolbar">
        <h2 id="list-title">All reservations</h2>
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </div>
      <div id="list-msg" class="msg" role="status"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Student</th>
              <th>Lab</th>
              <th>Date</th>
              <th class="num">Seats</th>
              <th>Purpose</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>No reservations yet. Add one using the form.</div>
    </section>
  </main>

  <script>
    const API = "/api/reservations";

    const $ = (id) => document.getElementById(id);

    const escapeHtml = (value) =>
      String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = `msg show ${type}`;
    }

    function clearMessage(element) {
      element.textContent = "";
      element.className = "msg";
    }

    function renderRows(reservations) {
      $("rows").innerHTML = reservations
        .map(
          (r) => `
            <tr>
              <td>${r.id}</td>
              <td>${escapeHtml(r.student_name)}</td>
              <td>${escapeHtml(r.lab)}</td>
              <td>${escapeHtml(r.date)}</td>
              <td class="num">${r.number_of_seats}</td>
              <td>${escapeHtml(r.purpose)}</td>
              <td><button class="danger" type="button" data-id="${r.id}">Delete</button></td>
            </tr>`
        )
        .join("");
      $("empty").hidden = reservations.length > 0;
    }

    async function loadAll() {
      try {
        const response = await fetch(API);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not load reservations.");
        renderRows(data);
        clearMessage($("list-msg"));
      } catch (error) {
        showMessage($("list-msg"), error.message, "error");
      }
    }

    $("find-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = $("find-id").value.trim();
      $("find-result").innerHTML = "";
      clearMessage($("find-msg"));

      if (!id) {
        showMessage($("find-msg"), "Enter a reservation ID.", "error");
        return;
      }

      try {
        const response = await fetch(`${API}/${encodeURIComponent(id)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Search failed.");

        $("find-result").innerHTML = `
          <div class="found">
            <dl>
              <dt>ID</dt><dd>${data.id}</dd>
              <dt>Student</dt><dd>${escapeHtml(data.student_name)}</dd>
              <dt>Lab</dt><dd>${escapeHtml(data.lab)}</dd>
              <dt>Date</dt><dd>${escapeHtml(data.date)}</dd>
              <dt>Seats</dt><dd>${data.number_of_seats}</dd>
              <dt>Purpose</dt><dd>${escapeHtml(data.purpose)}</dd>
            </dl>
          </div>`;
      } catch (error) {
        showMessage($("find-msg"), error.message, "error");
      }
    });

    $("add-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;

      const payload = {
        student_name: form.student_name.value,
        lab: form.lab.value,
        date: form.date.value,
        number_of_seats: form.number_of_seats.value === "" ? "" : Number(form.number_of_seats.value),
        purpose: form.purpose.value
      };

      try {
        const response = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not add reservation.");

        showMessage($("add-msg"), `Reservation #${data.id} added.`, "success");
        form.reset();
        loadAll();
      } catch (error) {
        showMessage($("add-msg"), error.message, "error");
      }
    });

    $("rows").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;

      const id = button.dataset.id;
      if (!confirm(`Delete reservation #${id}?`)) return;

      try {
        const response = await fetch(`${API}/${id}`, { method: "DELETE" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not delete reservation.");

        showMessage($("list-msg"), `Reservation #${id} deleted.`, "success");
        $("find-result").innerHTML = "";
        loadAll();
      } catch (error) {
        showMessage($("list-msg"), error.message, "error");
      }
    });

    $("refresh").addEventListener("click", loadAll);

    loadAll();
  </script>
</body>
</html>
